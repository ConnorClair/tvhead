<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
height=device-height,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover
"

>

<meta
name="mobile-web-app-capable"
content="yes"

>

<meta
name="apple-mobile-web-app-capable"
content="yes"

>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black"

>

<meta

<title>TV Head</title>

<style>

/* ============================================================
   BASIC
============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: black;

    color: white;

    touch-action: none;

    overscroll-behavior: none;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ============================================================
   MAIN SCREEN
============================================================ */

#screen {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    width: 100vw;
    height: 100vh;

    height: 100dvh;

    display: flex;

    align-items: center;
    justify-content: center;

    background: black;

}


/* ============================================================
   FACE
============================================================ */

#face {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    pointer-events: none;

}


/* ============================================================
   STATIC
============================================================ */

#staticOverlay {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    width: 100vw;
    height: 100vh;

    height: 100dvh;

    object-fit: cover;

    z-index: 30;

    pointer-events: none;

    opacity: 0.25;

}


/* ============================================================
   START SCREEN
============================================================ */

#start {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    height: 100dvh;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding:
        env(safe-area-inset-top)
        25px
        env(safe-area-inset-bottom)
        25px;

    background: black;

    text-align: center;

}


#start h1 {

    margin: 0;

    font-size: clamp(
        28px,
        8vw,
        50px
    );

}


#start p {

    max-width: 500px;

    line-height: 1.5;

}


/* ============================================================
   BUTTONS
============================================================ */

button {

    border: none;

    border-radius: 12px;

    padding: 15px 25px;

    min-height: 50px;

    background: #222;

    color: white;

    font-size: 18px;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-appearance: none;

}


button:active {

    transform: scale(0.96);

}


/* ============================================================
   CONTROLS
============================================================ */

#controls {

    position: fixed;

    right:
        calc(
            25px +
            env(safe-area-inset-right)
        );

    bottom:
        calc(
            25px +
            env(safe-area-inset-bottom)
        );

    z-index: 50;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.4s ease;

}


#controls.visible {

    opacity: 1;

    pointer-events: auto;

}


#settingsButton {

    width: 60px;
    height: 60px;

    min-height: 60px;

    padding: 0;

    border-radius: 50%;

    background:
        rgba(0, 0, 0, 0.75);

    border:
        1px solid
        rgba(255,255,255,0.3);

    font-size: 28px;

}


/* ============================================================
   SETTINGS PANEL
============================================================ */

#settingsPanel {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 90;

    width: min(
        90vw,
        450px
    );

    max-height: 90dvh;

    overflow-y: auto;

    padding: 25px;

    padding-top:
        calc(
            25px +
            env(safe-area-inset-top)
        );

    padding-bottom:
        calc(
            25px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(20,20,20,0.97);

    border-radius: 16px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.7);

    display: none;

    -webkit-overflow-scrolling: touch;

}


#settingsPanel.open {

    display: block;

}


#settingsPanel h2 {

    margin-top: 0;

}


.setting {

    margin: 25px 0;

}


.setting label {

    display: block;

    margin-bottom: 10px;

    font-size: 18px;

}


.setting input[type="range"] {

    width: 100%;

    height: 35px;

    touch-action: pan-x;

}


.settingValue {

    margin-top: 5px;

    font-family: monospace;

}


/* ============================================================
   DEBUG
============================================================ */

#debug {

    position: fixed;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    left:
        calc(
            10px +
            env(safe-area-inset-left)
        );

    z-index: 200;

    padding: 12px;

    background:
        rgba(0,0,0,0.75);

    border-radius: 6px;

    color: white;

    font-family: monospace;

    font-size: 14px;

    line-height: 1.5;

    pointer-events: none;

}


#debug.hidden {

    display: none;

}


/* ============================================================
   FULLSCREEN
============================================================ */

:fullscreen {

    background: black;

}


:-webkit-full-screen {

    background: black;

}


/* ============================================================
   LANDSCAPE
============================================================ */

@media (orientation: landscape) {

    #settingsPanel {

        max-height: 85dvh;

    }

}


/* ============================================================
   SMALL SCREENS
============================================================ */

@media (max-height: 500px) {

    #settingsPanel {

        padding: 18px;

        max-height: 92dvh;

    }

    .setting {

        margin: 15px 0;

    }

    #start {

        gap: 8px;

    }

}

</style>

</head>

<body>

<!-- ============================================================
     FACE
============================================================ -->

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
    alt=""
    draggable="false"
>
```

</div>

<!-- ============================================================
     STATIC
============================================================ -->

<img
id="staticOverlay"
src="faces/static.gif"
alt=""
draggable="false"

>

<!-- ============================================================
     START
============================================================ -->

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the device in the position
    it will be worn.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<!-- ============================================================
     CONTROLS
============================================================ -->

<div id="controls">

```
<button
    id="settingsButton"
    aria-label="Settings"
>
    ⚙
</button>
```

</div>

<!-- ============================================================
     SETTINGS
============================================================ -->

<div id="settingsPanel">

```
<h2>Settings</h2>


<!-- FULLSCREEN -->

<div class="setting">

    <label>
        Fullscreen
    </label>

    <button id="fullscreenButton">
        Enter Fullscreen
    </button>

</div>


<!-- DEBUG -->

<div class="setting">

    <label>
        Debug Display
    </label>

    <button id="debugToggle">
        Hide Debug
    </button>

</div>


<!-- SENSITIVITY -->

<div class="setting">

    <label>
        Movement Sensitivity
    </label>

    <input
        id="sensitivity"
        type="range"
        min="20"
        max="200"
        step="5"
        value="80"
    >

    <div
        id="sensitivityValue"
        class="settingValue"
    >
        80 °/s
    </div>

</div>


<!-- FACE TIME -->

<div class="setting">

    <label>
        Face Display Time
    </label>

    <input
        id="faceTime"
        type="range"
        min="0.25"
        max="10"
        step="0.25"
        value="2"
    >

    <div
        id="faceTimeValue"
        class="settingValue"
    >
        2.00 seconds
    </div>

</div>


<!-- STATIC -->

<div class="setting">

    <label>
        TV Static
    </label>

    <button id="staticToggle">
        Hide Static
    </button>

</div>


<!-- STATIC OPACITY -->

<div class="setting">

    <label>
        Static Opacity
    </label>

    <input
        id="staticOpacity"
        type="range"
        min="0"
        max="100"
        step="1"
        value="25"
    >

    <div
        id="staticOpacityValue"
        class="settingValue"
    >
        25%
    </div>

</div>


<button id="closeSettings">
    CLOSE
</button>
```

</div>

<!-- ============================================================
     DEBUG
============================================================ -->

<div id="debug">

```
Sensor: WAITING
```

</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    rotationThreshold: 80,

    minimumFaceTime: 2000,

    controlsFadeTime: 2500,

    staticOpacity: 0.25

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById(
        "face"
    );

const startScreen =
    document.getElementById(
        "start"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const controls =
    document.getElementById(
        "controls"
    );

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const settingsPanel =
    document.getElementById(
        "settingsPanel"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );

const debug =
    document.getElementById(
        "debug"
    );

const debugToggle =
    document.getElementById(
        "debugToggle"
    );

const sensitivity =
    document.getElementById(
        "sensitivity"
    );

const sensitivityValue =
    document.getElementById(
        "sensitivityValue"
    );

const faceTime =
    document.getElementById(
        "faceTime"
    );

const faceTimeValue =
    document.getElementById(
        "faceTimeValue"
    );

const staticOverlay =
    document.getElementById(
        "staticOverlay"
    );

const staticToggle =
    document.getElementById(
        "staticToggle"
    );

const staticOpacity =
    document.getElementById(
        "staticOpacity"
    );

const staticOpacityValue =
    document.getElementById(
        "staticOpacityValue"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "center";


// ============================================================
// MOTION
// ============================================================

let alpha = 0;

let beta = 0;

let gamma = 0;


// ============================================================
// STATE
// ============================================================

let sensorReady = false;

let faceStartedAt = 0;

let faceTimer = null;

let controlsTimer = null;

let debugVisible = true;

let staticVisible = true;


// ============================================================
// FACE
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }


    if (currentFace === name) {
        return;
    }


    currentFace = name;

    face.src =
        faces[name];

}


// ============================================================
// TRIGGER FACE
// ============================================================

function triggerFace(name) {

    /*
     * Same direction does not restart
     * the display timer.
     */

    if (currentFace === name) {
        return;
    }


    /*
     * A different direction immediately
     * replaces the current face.
     */

    clearTimeout(faceTimer);


    setFace(name);


    faceStartedAt =
        Date.now();


    faceTimer =
        setTimeout(
            () => {

                setFace("center");

            },
            SETTINGS.minimumFaceTime
        );

}


// ============================================================
// MOTION SENSOR
// ============================================================

function motionChanged(event) {

    if (!sensorReady) {
        return;
    }


    const rate =
        event.rotationRate;


    if (!rate) {
        return;
    }


    alpha =
        Number(rate.alpha) || 0;

    beta =
        Number(rate.beta) || 0;

    gamma =
        Number(rate.gamma) || 0;


    detectRotation();

    updateDebug();

}


// ============================================================
// ROTATION DETECTION
// ============================================================

function detectRotation() {

    const threshold =
        SETTINGS.rotationThreshold;


    /*
     * Horizontal head rotation.
     */

    if (
        Math.abs(alpha) >= threshold
    ) {

        if (alpha > 0) {

            triggerFace("right");

        } else {

            triggerFace("left");

        }

        return;

    }


    /*
     * Vertical head rotation.
     */

    if (
        Math.abs(beta) >= threshold
    ) {

        if (beta > 0) {

            triggerFace("down");

        } else {

            triggerFace("up");

        }

        return;

    }

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    if (!debugVisible) {
        return;
    }


    const remaining =
        currentFace === "center"
            ? 0
            : Math.max(
                0,
                SETTINGS.minimumFaceTime -
                (
                    Date.now() -
                    faceStartedAt
                )
            );


    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Alpha: " +
        alpha.toFixed(1) +
        " °/s<br>" +

        "Beta: " +
        beta.toFixed(1) +
        " °/s<br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        " °/s<br><br>" +

        "Threshold: " +
        SETTINGS.rotationThreshold +
        " °/s<br>" +

        "Face time: " +
        (remaining / 1000).toFixed(2) +
        " s<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// SHOW CONTROLS
// ============================================================

function showControls() {

    controls.classList.add(
        "visible"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            () => {

                if (
                    !settingsPanel.classList
                        .contains("open")
                ) {

                    controls.classList.remove(
                        "visible"
                    );

                }

            },
            SETTINGS.controlsFadeTime
        );

}


// ============================================================
// MOBILE SCREEN INTERACTION
// ============================================================

document.addEventListener(
    "pointerdown",
    (event) => {

        /*
         * Don't show the controls when
         * interacting with the settings UI.
         */

        if (
            settingsPanel.contains(
                event.target
            )
        ) {

            return;

        }


        if (
            event.target ===
            settingsButton
        ) {

            return;

        }


        showControls();

    },
    {
        passive: true
    }
);


// ============================================================
// SETTINGS BUTTON
// ============================================================

settingsButton.addEventListener(
    "pointerdown",
    (event) => {

        event.stopPropagation();

        settingsPanel.classList.add(
            "open"
        );


        clearTimeout(
            controlsTimer
        );


        controls.classList.add(
            "visible"
        );

    }
);


// ============================================================
// CLOSE SETTINGS
// ============================================================

closeSettings.addEventListener(
    "click",
    () => {

        settingsPanel.classList.remove(
            "open"
        );

        showControls();

    }
);


// ============================================================
// DEBUG
// ============================================================

debugToggle.addEventListener(
    "click",
    () => {

        debugVisible =
            !debugVisible;


        if (debugVisible) {

            debug.classList.remove(
                "hidden"
            );

            debugToggle.textContent =
                "Hide Debug";

            updateDebug();

        } else {

            debug.classList.add(
                "hidden"
            );

            debugToggle.textContent =
                "Show Debug";

        }

    }
);


// ============================================================
// SENSITIVITY
// ============================================================

sensitivity.addEventListener(
    "input",
    () => {

        SETTINGS.rotationThreshold =
            Number(
                sensitivity.value
            );


        sensitivityValue.textContent =
            SETTINGS.rotationThreshold +
            " °/s";


        updateDebug();

    }
);


// ============================================================
// FACE TIME
// ============================================================

faceTime.addEventListener(
    "input",
    () => {

        const seconds =
            Number(
                faceTime.value
            );


        SETTINGS.minimumFaceTime =
            seconds * 1000;


        faceTimeValue.textContent =
            seconds.toFixed(2) +
            " seconds";


        /*
         * Restart the current face timer
         * if a directional face is active.
         */

        if (
            currentFace !== "center"
        ) {

            clearTimeout(
                faceTimer
            );


            faceStartedAt =
                Date.now();


            faceTimer =
                setTimeout(
                    () => {

                        setFace("center");

                    },
                    SETTINGS.minimumFaceTime
                );

        }


        updateDebug();

    }
);


// ============================================================
// STATIC
// ============================================================

staticToggle.addEventListener(
    "click",
    () => {

        staticVisible =
            !staticVisible;


        if (staticVisible) {

            staticOverlay.style.display =
                "block";

            staticToggle.textContent =
                "Hide Static";

        } else {

            staticOverlay.style.display =
                "none";

            staticToggle.textContent =
                "Show Static";

        }

    }
);


// ============================================================
// STATIC OPACITY
// ============================================================

staticOpacity.addEventListener(
    "input",
    () => {

        const value =
            Number(
                staticOpacity.value
            );


        SETTINGS.staticOpacity =
            value / 100;


        staticOverlay.style.opacity =
            SETTINGS.staticOpacity;


        staticOpacityValue.textContent =
            value + "%";

    }
);


// ============================================================
// FULLSCREEN
// ============================================================

async function enterFullscreen() {

    /*
     * Standard Fullscreen API.
     */

    if (
        document.documentElement
            .requestFullscreen
    ) {

        await document.documentElement
            .requestFullscreen();

        return true;

    }


    /*
     * Older WebKit browsers.
     */

    if (
        document.documentElement
            .webkitRequestFullscreen
    ) {

        document.documentElement
            .webkitRequestFullscreen();

        return true;

    }


    return false;

}


async function exitFullscreen() {

    if (
        document.exitFullscreen
    ) {

        await document.exitFullscreen();

        return true;

    }


    if (
        document.webkitExitFullscreen
    ) {

        document.webkitExitFullscreen();

        return true;

    }


    return false;

}


function isFullscreen() {

    return Boolean(

        document.fullscreenElement ||

        document.webkitFullscreenElement

    );

}


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                isFullscreen()
            ) {

                await exitFullscreen();

                fullscreenButton.textContent =
                    "Enter Fullscreen";

            } else {

                const success =
                    await enterFullscreen();


                if (success) {

                    fullscreenButton.textContent =
                        "Exit Fullscreen";

                } else {

                    alert(
                        "Fullscreen is not supported by this browser."
                    );

                }

            }

        } catch (error) {

            console.error(error);

            alert(
                "Fullscreen could not be enabled."
            );

        }

    }
);


// ============================================================
// FULLSCREEN STATE
// ============================================================

function updateFullscreenButton() {

    if (
        isFullscreen()
    ) {

        fullscreenButton.textContent =
            "Exit Fullscreen";

    } else {

        fullscreenButton.textContent =
            "Enter Fullscreen";

    }

}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);


// ============================================================
// START SENSOR
// ============================================================

async function startMotionSensor() {

    /*
     * iOS 13+ requires permission to be requested
     * from a user interaction such as pressing START.
     */

    if (
        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                debug.innerHTML =
                    "Sensor: PERMISSION DENIED";

                alert(
                    "Motion sensor permission was denied."
                );

                return false;

            }

        } catch (error) {

            console.error(error);

            debug.innerHTML =
                "Sensor: PERMISSION ERROR";

            return false;

        }

    }


    /*
     * Android and browsers that do not require
     * explicit permission.
     */

    if (
        typeof DeviceMotionEvent ===
        "undefined"
    ) {

        debug.innerHTML =
            "Sensor: NOT SUPPORTED";

        alert(
            "This device does not provide a motion sensor."
        );

        return false;

    }


    /*
     * Listen for motion.
     */

    window.addEventListener(
        "devicemotion",
        motionChanged,
        {
            passive: true
        }
    );


    sensorReady = true;


    return true;

}


// ============================================================
// START
// ============================================================

startButton.addEventListener(
    "click",
    async () => {

        startButton.disabled =
            true;


        startButton.textContent =
            "STARTING...";


        const success =
            await startMotionSensor();


        if (!success) {

            startButton.disabled =
                false;

            startButton.textContent =
                "START";

            return;

        }


        setFace("center");


        startScreen.style.display =
            "none";


        debugVisible = true;

        debug.classList.remove(
            "hidden"
        );


        updateDebug();

    }
);


// ============================================================
// INITIAL STATE
// ============================================================

staticOverlay.style.opacity =
    SETTINGS.staticOpacity;


debug.classList.remove(
    "hidden"
);


/*
 * Make the initial face explicit.
 */

face.src =
    faces.center;


</script>

</body>

</html>
