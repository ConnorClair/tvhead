<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    touch-action: none;
    overscroll-behavior: none;
    font-family: Arial, sans-serif;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

#face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}

#staticOverlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 30;
}

#start {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

    background: #000;
    color: #fff;
    text-align: center;
}

#start h1 {
    margin: 0 0 20px;
    font-size: 42px;
}

#start p {
    margin: 5px 0;
    font-size: 18px;
    opacity: 0.8;
}

#startButton {
    margin-top: 30px;
    padding: 15px 35px;

    border: 2px solid #fff;
    border-radius: 8px;

    background: #000;
    color: #fff;

    font-size: 20px;
    font-weight: bold;
}

#controls {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 80;

    opacity: 0;
    transition: opacity 0.4s ease;

    padding:
        0
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        0;
}

#controls.visible {
    opacity: 1;
}

#settingsButton {
    width: 55px;
    height: 55px;

    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 50%;

    background: rgba(0,0,0,0.65);
    color: white;

    font-size: 28px;
}

#settingsPanel {
    position: fixed;
    inset: 0;
    z-index: 90;

    display: none;
    overflow-y: auto;

    padding:
        30px
        calc(30px + env(safe-area-inset-right))
        calc(30px + env(safe-area-inset-bottom))
        calc(30px + env(safe-area-inset-left));

    background: rgba(0,0,0,0.95);
    color: white;
}

#settingsPanel.open {
    display: block;
}

#settingsPanel h2 {
    margin-top: 0;
    font-size: 30px;
}

.setting {
    margin-bottom: 25px;
}

.setting label {
    display: block;
    margin-bottom: 8px;
    font-size: 18px;
}

.settingValue {
    margin-top: 5px;
    opacity: 0.7;
}

.setting input[type="range"] {
    width: 100%;
}

.setting button,
#closeSettings {
    padding: 10px 16px;

    border: 1px solid #fff;
    border-radius: 5px;

    background: #111;
    color: #fff;

    font-size: 16px;
}

#closeSettings {
    margin-top: 10px;
}

#debug {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 200;

    padding: 10px;

    background: rgba(0,0,0,0.7);
    color: #0f0;

    font-family: monospace;
    font-size: 14px;

    pointer-events: none;
}

#debug.hidden {
    display: none;
}
</style>

</head>

<body>

```

</div>

<div id="debug">
    Sensor: WAITING
</div>

<script>

const SETTINGS = {
    accelerationThreshold: 3.0,
    minimumFaceTime: 2000,
    controlsFadeTime: 2500,
    staticOpacity: 0.25
};

const face = document.getElementById("face");
const startScreen = document.getElementById("start");
const startButton = document.getElementById("startButton");

const controls = document.getElementById("controls");
const settingsButton = document.getElementById("settingsButton");

const settingsPanel = document.getElementById("settingsPanel");
const closeSettings = document.getElementById("closeSettings");

const debug = document.getElementById("debug");
const debugToggle = document.getElementById("debugToggle");

const sensitivity = document.getElementById("sensitivity");
const sensitivityValue = document.getElementById("sensitivityValue");

const faceTime = document.getElementById("faceTime");
const faceTimeValue = document.getElementById("faceTimeValue");

const staticOverlay = document.getElementById("staticOverlay");
const staticToggle = document.getElementById("staticToggle");

const staticOpacity = document.getElementById("staticOpacity");
const staticOpacityValue = document.getElementById("staticOpacityValue");

const fullscreenButton =
    document.getElementById("fullscreenButton");


const faces = {
    center: "faces/center.png",
    left: "faces/left.png",
    right: "faces/right.png",
    up: "faces/up.png",
    down: "faces/down.png"
};


let currentFace = "center";

let accelerationX = 0;
let accelerationY = 0;
let accelerationZ = 0;

let previousX = null;
let previousY = null;
let previousZ = null;

let sensorReady = false;

let faceStartedAt = 0;
let faceTimer = null;
let controlsTimer = null;

let debugVisible = true;
let staticVisible = true;


/*
    Change the face image.
*/

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;
    face.src = faces[name];
}


/*
    Trigger a directional face.

    Important:
    The timer only resets when the direction
    actually changes.
*/

function triggerFace(name) {

    if (currentFace === name) {
        return;
    }

    clearTimeout(faceTimer);

    setFace(name);

    faceStartedAt = Date.now();

    faceTimer = setTimeout(() => {

        setFace("center");

    }, SETTINGS.minimumFaceTime);
}


/*
    Accelerometer processing.
*/

function motionChanged(event) {

    if (!sensorReady) {
        return;
    }

    const acceleration =
        event.accelerationIncludingGravity;

    if (!acceleration) {
        return;
    }


    const x = Number(acceleration.x) || 0;
    const y = Number(acceleration.y) || 0;
    const z = Number(acceleration.z) || 0;


    /*
        First reading establishes our baseline.
    */

    if (
        previousX === null ||
        previousY === null ||
        previousZ === null
    ) {

        previousX = x;
        previousY = y;
        previousZ = z;

        return;
    }


    /*
        Calculate how much acceleration changed
        since the previous sensor reading.
    */

    const dx = x - previousX;
    const dy = y - previousY;
    const dz = z - previousZ;


    previousX = x;
    previousY = y;
    previousZ = z;


    accelerationX = dx;
    accelerationY = dy;
    accelerationZ = dz;


    detectMovement();

    updateDebug();
}


/*
    Detect movement direction.

    Because the tablet is being held in landscape,
    X is treated as left/right and Y as up/down.

    If your particular SM-T510 reports these
    directions reversed, we can swap them.
*/

function detectMovement() {

    const threshold =
        SETTINGS.accelerationThreshold;


    const absX = Math.abs(accelerationX);
    const absY = Math.abs(accelerationY);


    /*
        Pick whichever axis had the strongest
        movement.
    */

    if (
        absX < threshold &&
        absY < threshold
    ) {
        return;
    }


    if (absX >= absY) {

        if (accelerationX > 0) {
            triggerFace("right");
        } else {
            triggerFace("left");
        }

        return;
    }


    if (accelerationY > 0) {
        triggerFace("down");
    } else {
        triggerFace("up");
    }
}


/*
    Debug information.
*/

function updateDebug() {

    if (!debugVisible) {
        return;
    }


    const remaining =
        currentFace === "center"
            ? 0
            : Math.max(
                0,
                SETTINGS.minimumFaceTime -
                (Date.now() - faceStartedAt)
            );


    debug.innerHTML =
        "Sensor: ACTIVE<br><br>" +

        "X: " +
        accelerationX.toFixed(2) +
        " m/s²<br>" +

        "Y: " +
        accelerationY.toFixed(2) +
        " m/s²<br>" +

        "Z: " +
        accelerationZ.toFixed(2) +
        " m/s²<br><br>" +

        "Threshold: " +
        SETTINGS.accelerationThreshold.toFixed(1) +
        " m/s²<br>" +

        "Face time: " +
        (remaining / 1000).toFixed(2) +
        " s<br><br>" +

        "Face: " +
        currentFace;
}


/*
    Settings button fade.
*/

function showControls() {

    controls.classList.add("visible");

    clearTimeout(controlsTimer);

    controlsTimer = setTimeout(() => {

        if (!settingsPanel.classList.contains("open")) {
            controls.classList.remove("visible");
        }

    }, SETTINGS.controlsFadeTime);
}


document.addEventListener(
    "pointerdown",
    (event) => {

        if (settingsPanel.contains(event.target)) {
            return;
        }

        if (event.target === settingsButton) {
            return;
        }

        showControls();

    },
    { passive: true }
);


/*
    Open settings.
*/

settingsButton.addEventListener(
    "pointerdown",
    (event) => {

        event.stopPropagation();

        settingsPanel.classList.add("open");

        clearTimeout(controlsTimer);

        controls.classList.add("visible");

    }
);


/*
    Close settings.
*/

closeSettings.addEventListener(
    "click",
    () => {

        settingsPanel.classList.remove("open");

        showControls();

    }
);


/*
    Debug toggle.
*/

debugToggle.addEventListener(
    "click",
    () => {

        debugVisible = !debugVisible;


        if (debugVisible) {

            debug.classList.remove("hidden");

            debugToggle.textContent =
                "Hide Debug";

            updateDebug();

        } else {

            debug.classList.add("hidden");

            debugToggle.textContent =
                "Show Debug";
        }

    }
);


/*
    Movement sensitivity.
*/

sensitivity.addEventListener(
    "input",
    () => {

        SETTINGS.accelerationThreshold =
            Number(sensitivity.value);

        sensitivityValue.textContent =
            SETTINGS.accelerationThreshold.toFixed(1);

        updateDebug();

    }
);


/*
    Face display time.
*/

faceTime.addEventListener(
    "input",
    () => {

        const seconds =
            Number(faceTime.value);

        SETTINGS.minimumFaceTime =
            seconds * 1000;

        faceTimeValue.textContent =
            seconds.toFixed(2) +
            " seconds";


        if (currentFace !== "center") {

            clearTimeout(faceTimer);

            faceStartedAt =
                Date.now();

            faceTimer =
                setTimeout(() => {

                    setFace("center");

                }, SETTINGS.minimumFaceTime);
        }


        updateDebug();

    }
);


/*
    Static toggle.
*/

staticToggle.addEventListener(
    "click",
    () => {

        staticVisible = !staticVisible;


        if (staticVisible) {

            staticOverlay.style.display =
                "block";

            staticToggle.textContent =
                "Hide Static";

        } else {

            staticOverlay.style.display =
                "none";

            staticToggle.textContent =
                "Show Static";
        }

    }
);


/*
    Static opacity.
*/

staticOpacity.addEventListener(
    "input",
    () => {

        const value =
            Number(staticOpacity.value);

        SETTINGS.staticOpacity =
            value / 100;

        staticOverlay.style.opacity =
            SETTINGS.staticOpacity;

        staticOpacityValue.textContent =
            value + "%";

    }
);


/*
    Fullscreen.
*/

async function enterFullscreen() {

    if (
        document.documentElement
            .requestFullscreen
    ) {

        await document.documentElement
            .requestFullscreen();

        return true;
    }


    if (
        document.documentElement
            .webkitRequestFullscreen
    ) {

        document.documentElement
            .webkitRequestFullscreen();

        return true;
    }


    return false;
}


async function exitFullscreen() {

    if (document.exitFullscreen) {

        await document.exitFullscreen();

        return true;
    }


    if (document.webkitExitFullscreen) {

        document.webkitExitFullscreen();

        return true;
    }


    return false;
}


function isFullscreen() {

    return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
    );
}


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (isFullscreen()) {

                await exitFullscreen();

                fullscreenButton.textContent =
                    "Enter Fullscreen";

            } else {

                const success =
                    await enterFullscreen();


                if (success) {

                    fullscreenButton.textContent =
                        "Exit Fullscreen";

                } else {

                    alert(
                        "Fullscreen is not supported by this browser."
                    );
                }
            }

        } catch (error) {

            console.error(error);

            alert(
                "Fullscreen could not be enabled."
            );
        }

    }
);


function updateFullscreenButton() {

    if (isFullscreen()) {

        fullscreenButton.textContent =
            "Exit Fullscreen";

    } else {

        fullscreenButton.textContent =
            "Enter Fullscreen";
    }
}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);


/*
    Start accelerometer.

    Android normally does not require the
    iOS-style permission request, but we keep
    the check for compatibility.
*/

async function startMotionSensor() {


    if (
        typeof DeviceMotionEvent === "undefined"
    ) {

        debug.innerHTML =
            "Sensor: NOT SUPPORTED";

        alert(
            "This device does not provide motion sensors."
        );

        return false;
    }


    /*
        iOS permission handling.
    */

    if (
        typeof DeviceMotionEvent.requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (permission !== "granted") {

                debug.innerHTML =
                    "Sensor: PERMISSION DENIED";

                alert(
                    "Motion sensor permission was denied."
                );

                return false;
            }

        } catch (error) {

            console.error(error);

            debug.innerHTML =
                "Sensor: PERMISSION ERROR";

            return false;
        }
    }


    /*
        Reset baseline.
    */

    previousX = null;
    previousY = null;
    previousZ = null;


    window.addEventListener(
        "devicemotion",
        motionChanged,
        {
            passive: true
        }
    );


    sensorReady = true;

    return true;
}


/*
    Start button.
*/

startButton.addEventListener(
    "click",
    async () => {

        startButton.disabled = true;

        startButton.textContent =
            "STARTING...";


        const success =
            await startMotionSensor();


        if (!success) {

            startButton.disabled = false;

            startButton.textContent =
                "START";

            return;
        }


        setFace("center");


        startScreen.style.display =
            "none";


        debugVisible = true;

        debug.classList.remove("hidden");

        updateDebug();

    }
);


/*
    Initial state.
*/

staticOverlay.style.opacity =
    SETTINGS.staticOpacity;

debug.classList.remove("hidden");

face.src = faces.center;

</script>

</body>
