<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="TV Head">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}


/* ============================================================
   FACE
============================================================ */

#screen {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: black;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}


/* ============================================================
   STATIC OVERLAY
============================================================ */

#staticOverlay {

    position: fixed;

    inset: 0;

    z-index: 30;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;

    opacity: 0.25;

    display: block;

}


/* ============================================================
   START SCREEN
============================================================ */

#start {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {

    padding: 16px 30px;

    font-size: 20px;

    border: none;

    border-radius: 10px;

}


/* ============================================================
   CONTROLS
============================================================ */

#controls {

    position: fixed;

    bottom: 30px;
    right: 30px;

    z-index: 50;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.4s ease;

}

#controls.visible {

    opacity: 1;

    pointer-events: auto;

}

#settingsButton {

    width: 60px;
    height: 60px;

    padding: 0;

    border-radius: 50%;

    background:
        rgba(0, 0, 0, 0.7);

    color: white;

    font-size: 28px;

}


/* ============================================================
   SETTINGS
============================================================ */

#settingsPanel {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 90;

    width: min(90vw, 450px);

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    background:
        rgba(20, 20, 20, 0.97);

    color: white;

    border-radius: 15px;

    display: none;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.7);

}

#settingsPanel.open {

    display: block;

}

#settingsPanel h2 {

    margin-top: 0;

}

.setting {

    margin: 25px 0;

}

.setting label {

    display: block;

    margin-bottom: 10px;

    font-size: 18px;

}

.setting input[type="range"] {

    width: 100%;

}

.settingValue {

    margin-top: 5px;

    font-family: monospace;

}

#closeSettings {

    width: 100%;

    margin-top: 10px;

}


/* ============================================================
   DEBUG
============================================================ */

#debug {

    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 200;

    padding: 12px;

    background:
        rgba(0, 0, 0, 0.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;

}

#debug.hidden {

    display: none;

}


/* ============================================================
   FULLSCREEN
============================================================ */

:fullscreen {

    background: black;

}

</style>

</head>

<body>

<button id="startButton">

```
<h2>Settings</h2>


<!-- FULLSCREEN -->

<div class="setting">

    <label>
        Fullscreen
    </label>

    <button id="fullscreenButton">
        Enter Fullscreen
    </button>

</div>


<!-- DEBUG -->

<div class="setting">

    <label>
        Debug Display
    </label>

    <button id="debugToggle">
        Hide Debug

</div>


<!-- SENSITIVITY -->

<div class="setting">

    <label>
        Movement Sensitivity
    </label>

    <input
        id="sensitivity"
        type="range"
        min="20"
        max="200"
        step="5"
        value="80"
    >

    <div
        id="sensitivityValue"
        class="settingValue"
    >
        80 °/s
    </div>

</div>


<!-- FACE TIME -->

<div class="setting">

    <label>
        Face Display Time
    </label>

    <input
        id="faceTime"
        type="range"
        min="0.25"
        max="10"
        step="0.25"
        value="2"
    >

    <div
        id="faceTimeValue"
        class="settingValue"
    >
        2.00 seconds
    </div>

</div>


<!-- STATIC -->

<div class="setting">

    <label>
        TV Static
    </label>

    <button id="staticToggle">
        Hide Static
    </button>

</div>


<!-- STATIC OPACITY -->

<div class="setting">

    <label>
        Static Opacity
    </label>

    <input
        id="staticOpacity"
        type="range"
        min="0"
        max="100"
        step="1"
        value="25"
    >

    <div
        id="staticOpacityValue"
        class="settingValue"
    >
        25%
    </div>

</div>


<button id="closeSettings">
    CLOSE
</button>
```

</div>

<!-- ============================================================
     DEBUG
============================================================ -->

<div id="debug">

```
Sensor: WAITING
```

</div>

<div id="sensorTest">
    Motion: waiting...
</div>

<script>
const SETTINGS = {
    rotationThreshold: 80,
    minimumFaceTime: 2000,
    controlsFadeTime: 2500,
    staticOpacity: 0.25
};

const faces = {
    center: "faces/center.png",
    left: "faces/left.png",
    right: "faces/right.png",
    up: "faces/up.png",
    down: "faces/down.png"
};

const faceImage = document.getElementById("faceImage");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const debug = document.getElementById("debug");

let currentFace = "center";
let faceTimer = null;
let faceStartedAt = 0;

let sensorReady = false;
let motionListenerAdded = false;
let orientationListenerAdded = false;

/*
    Current rotational velocity.

    alpha = rotation around Z
    beta  = rotation around X
    gamma = rotation around Y

    These are provided by DeviceMotionEvent.rotationRate
    on devices that expose gyroscope data.
*/
let alpha = 0;
let beta = 0;
let gamma = 0;

/*
    Orientation fallback.

    Some Android devices/browsers provide deviceorientation
    but don't provide rotationRate.
*/
let lastOrientation = null;
let lastOrientationTime = 0;

let gyroAvailable = false;
let orientationFallback = false;


/* ---------------- FACE CONTROL ---------------- */

function setFace(name) {
    if (!faces[name]) return;

    if (currentFace === name) return;

    currentFace = name;
    faceImage.src = faces[name];
}

function triggerFace(name) {
    if (currentFace === name) {
        // Same direction.
        // Do NOT restart the timer.
        return;
    }

    clearTimeout(faceTimer);

    setFace(name);

    faceStartedAt = Date.now();

    faceTimer = setTimeout(() => {
        setFace("center");
        faceStartedAt = 0;
    }, SETTINGS.minimumFaceTime);
}


/* ---------------- ROTATION DETECTION ---------------- */

function detectRotation() {
    const threshold = SETTINGS.rotationThreshold;

    /*
        Pick whichever axis currently has the largest
        rotational velocity.

        This prevents one weak axis from overriding a
        much stronger movement on another axis.
    */

    const absAlpha = Math.abs(alpha);
    const absBeta = Math.abs(beta);
    const absGamma = Math.abs(gamma);

    const strongest = Math.max(
        absAlpha,
        absBeta,
        absGamma
    );

    if (strongest < threshold) {
        return;
    }

    if (strongest === absAlpha) {
        if (alpha > 0) {
            triggerFace("right");
        } else {
            triggerFace("left");
        }

        return;
    }

    if (strongest === absBeta) {
        if (beta > 0) {
            triggerFace("down");
        } else {
            triggerFace("up");
        }

        return;
    }

    if (strongest === absGamma) {
        /*
            Gamma is rotation around the device's Y axis.

            Depending on how the device is physically held,
            gamma can represent horizontal movement instead
            of alpha.

            We therefore treat it as horizontal movement.
        */

        if (gamma > 0) {
            triggerFace("right");
        } else {
            triggerFace("left");
        }

        return;
    }
}


/* ---------------- GYROSCOPE ---------------- */

function motionChanged(event) {
    const rotation = event.rotationRate;

    if (!rotation) {
        gyroAvailable = false;
        return;
    }

    /*
        rotationRate is normally reported in degrees/second.
    */

    alpha = Number(rotation.alpha) || 0;
    beta = Number(rotation.beta) || 0;
    gamma = Number(rotation.gamma) || 0;

    gyroAvailable =
        Math.abs(alpha) > 0 ||
        Math.abs(beta) > 0 ||
        Math.abs(gamma) > 0;

    detectRotation();
    updateDebug();
}


/* ---------------- ORIENTATION FALLBACK ---------------- */

function orientationChanged(event) {
    const now = performance.now();

    /*
        If gyro data is working, don't use this fallback.
    */
    if (gyroAvailable) {
        return;
    }

    const current = {
        alpha: Number(event.alpha) || 0,
        beta: Number(event.beta) || 0,
        gamma: Number(event.gamma) || 0
    };

    if (lastOrientation === null) {
        lastOrientation = current;
        lastOrientationTime = now;
        return;
    }

    const deltaTime = (now - lastOrientationTime) / 1000;

    if (deltaTime <= 0 || deltaTime > 1) {
        lastOrientation = current;
        lastOrientationTime = now;
        return;
    }

    /*
        Calculate angular velocity from orientation changes.

        This gives us degrees/second even on devices where
        rotationRate isn't exposed.
    */

    const da = shortestAngleDifference(
        current.alpha,
        lastOrientation.alpha
    );

    const db = current.beta - lastOrientation.beta;

    const dg = current.gamma - lastOrientation.gamma;

    alpha = da / deltaTime;
    beta = db / deltaTime;
    gamma = dg / deltaTime;

    orientationFallback = true;

    detectRotation();
    updateDebug();

    lastOrientation = current;
    lastOrientationTime = now;
}


/*
    Correctly handles the 0° / 360° boundary.

    Example:

    359° -> 1°

    is a +2° movement, not -358°.
*/
function shortestAngleDifference(current, previous) {
    let difference = current - previous;

    while (difference > 180) {
        difference -= 360;
    }

    while (difference < -180) {
        difference += 360;
    }

    return difference;
}


/* ---------------- DEBUG ---------------- */

function updateDebug() {
    if (!debug) return;

    let sensorType = "Waiting";

    if (gyroAvailable) {
        sensorType = "GYROSCOPE";
    } else if (orientationFallback) {
        sensorType = "ORIENTATION FALLBACK";
    } else if (sensorReady) {
        sensorType = "SENSOR ACTIVE";
    }

    let remaining = 0;

    if (faceStartedAt && currentFace !== "center") {
        remaining = Math.max(
            0,
            SETTINGS.minimumFaceTime -
            (Date.now() - faceStartedAt)
        );
    }

    debug.innerHTML = `
        <b>Sensor:</b> ${sensorType}<br>
        <b>Alpha:</b> ${alpha.toFixed(1)} °/s<br>
        <b>Beta:</b> ${beta.toFixed(1)} °/s<br>
        <b>Gamma:</b> ${gamma.toFixed(1)} °/s<br>
        <b>Threshold:</b> ${SETTINGS.rotationThreshold} °/s<br>
        <b>Face:</b> ${currentFace}<br>
        <b>Face time:</b> ${(remaining / 1000).toFixed(2)} s
    `;
}


/* ---------------- SENSOR SETUP ---------------- */

async function startSensors() {

    /*
        iOS 13+ requires permission to access motion sensors.
    */

    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {
        try {
            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                alert(
                    "Motion sensor permission was denied.\n\n" +
                    "Allow Motion & Orientation Access for this website."
                );

                return false;
            }

        } catch (error) {
            console.error(
                "Motion permission error:",
                error
            );

            alert(
                "Could not access the motion sensors.\n\n" +
                error.message
            );

            return false;
        }
    }

    /*
        Standard DeviceMotion API.

        This is supported across modern:
        - Android phones
        - Android tablets
        - Samsung devices
        - Google Pixel
        - iPhone
        - iPad
        - Chrome
        - Safari
        - Firefox
    */

    if (!motionListenerAdded) {

        window.addEventListener(
            "devicemotion",
            motionChanged,
            true
        );

        motionListenerAdded = true;
    }


    /*
        Orientation fallback.

        This is useful for Android devices/browsers where
        rotationRate isn't supplied.
    */

    if (!orientationListenerAdded) {

        window.addEventListener(
            "deviceorientation",
            orientationChanged,
            true
        );

        orientationListenerAdded = true;
    }

    sensorReady = true;

    updateDebug();

    return true;
}


/* ---------------- START ---------------- */

if (startButton) {

    startButton.addEventListener(
        "click",
        async () => {

            const success = await startSensors();

            if (!success) {
                return;
            }

            setFace("center");

            if (startScreen) {
                startScreen.style.display = "none";
            }

            updateDebug();
        }
    );
}


/* ---------------- SETTINGS ---------------- */

const sensitivitySlider =
    document.getElementById("sensitivity");

const sensitivityValue =
    document.getElementById("sensitivityValue");

if (sensitivitySlider) {

    sensitivitySlider.value =
        SETTINGS.rotationThreshold;

    if (sensitivityValue) {
        sensitivityValue.textContent =
            SETTINGS.rotationThreshold;
    }

    sensitivitySlider.addEventListener(
        "input",
        () => {

            SETTINGS.rotationThreshold =
                Number(sensitivitySlider.value);

            if (sensitivityValue) {
                sensitivityValue.textContent =
                    SETTINGS.rotationThreshold;
            }

            updateDebug();
        }
    );
}


const faceTimeSlider =
    document.getElementById("faceTime");

const faceTimeValue =
    document.getElementById("faceTimeValue");

if (faceTimeSlider) {

    faceTimeSlider.value =
        SETTINGS.minimumFaceTime / 1000;

    if (faceTimeValue) {
        faceTimeValue.textContent =
            Number(faceTimeSlider.value).toFixed(2);
    }

    faceTimeSlider.addEventListener(
        "input",
        () => {

            SETTINGS.minimumFaceTime =
                Number(faceTimeSlider.value) * 1000;

            if (faceTimeValue) {
                faceTimeValue.textContent =
                    Number(faceTimeSlider.value).toFixed(2);
            }

            /*
                If a face is currently being held,
                changing the setting restarts its timer.
            */

            if (currentFace !== "center") {

                clearTimeout(faceTimer);

                faceStartedAt = Date.now();

                faceTimer = setTimeout(
                    () => {
                        setFace("center");
                        faceStartedAt = 0;
                    },
                    SETTINGS.minimumFaceTime
                );
            }

            updateDebug();
        }
    );
}


/* ---------------- STATIC ---------------- */

const staticOverlay =
    document.getElementById("staticOverlay");

const staticToggle =
    document.getElementById("staticToggle");

const staticOpacity =
    document.getElementById("staticOpacity");

const staticOpacityValue =
    document.getElementById("staticOpacityValue");

if (staticOverlay) {
    staticOverlay.style.opacity =
        SETTINGS.staticOpacity;
}

if (staticToggle) {

    staticToggle.checked = true;

    staticToggle.addEventListener(
        "change",
        () => {

            staticOverlay.style.display =
                staticToggle.checked
                    ? "block"
                    : "none";
        }
    );
}

if (staticOpacity) {

    staticOpacity.value =
        SETTINGS.staticOpacity;

    if (staticOpacityValue) {
        staticOpacityValue.textContent =
            Math.round(
                SETTINGS.staticOpacity * 100
            ) + "%";
    }

    staticOpacity.addEventListener(
        "input",
        () => {

            SETTINGS.staticOpacity =
                Number(staticOpacity.value);

            staticOverlay.style.opacity =
                SETTINGS.staticOpacity;

            if (staticOpacityValue) {
                staticOpacityValue.textContent =
                    Math.round(
                        SETTINGS.staticOpacity * 100
                    ) + "%";
            }
        }
    );
}


/* ---------------- CONTROLS ---------------- */

const controls =
    document.getElementById("controls");

const settingsButton =
    document.getElementById("settingsButton");

const settingsPanel =
    document.getElementById("settingsPanel");

let controlsTimer = null;

function showControls() {

    if (!controls) return;

    controls.classList.add("visible");

    clearTimeout(controlsTimer);

    controlsTimer = setTimeout(
        () => {
            controls.classList.remove("visible");
        },
        SETTINGS.controlsFadeTime
    );
}

document.body.addEventListener(
    "click",
    event => {

        if (
            event.target.closest("#controls") ||
            event.target.closest("#settingsPanel")
        ) {
            return;
        }

        showControls();
    }
);


if (settingsButton) {

    settingsButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            if (settingsPanel) {
                settingsPanel.classList.toggle("open");
            }

            showControls();
        }
    );
}


/* ---------------- DEBUG TOGGLE ---------------- */

const debugToggle =
    document.getElementById("debugToggle");

if (debugToggle && debug) {

    debugToggle.checked = true;

    debugToggle.addEventListener(
        "change",
        () => {

            if (debugToggle.checked) {
                debug.classList.remove("hidden");
            } else {
                debug.classList.add("hidden");
            }
        }
    );
}


/* ---------------- FULLSCREEN ---------------- */

const fullscreenButton =
    document.getElementById("fullscreenButton");

if (fullscreenButton) {

    fullscreenButton.addEventListener(
        "click",
        async event => {

            event.stopPropagation();

            try {

                if (!document.fullscreenElement) {

                    if (
                        !document.documentElement.requestFullscreen
                    ) {
                        throw new Error(
                            "Fullscreen API is not supported by this browser."
                        );
                    }

                    await document.documentElement
                        .requestFullscreen();

                    fullscreenButton.textContent =
                        "Exit Fullscreen";

                    /*
                        Try to lock landscape on devices
                        that support it.
                    */

                    if (
                        screen.orientation &&
                        screen.orientation.lock
                    ) {
                        try {
                            await screen.orientation.lock(
                                "landscape"
                            );
                        } catch (orientationError) {
                            console.log(
                                "Orientation lock unavailable:",
                                orientationError
                            );
                        }
                    }

                } else {

                    await document.exitFullscreen();

                    fullscreenButton.textContent =
                        "Enter Fullscreen";
                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

                alert(
                    "Fullscreen failed:\n\n" +
                    error.name +
                    "\n" +
                    error.message
                );
            }
        }
    );
}


/* ---------------- FULLSCREEN STATE ---------------- */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (!fullscreenButton) return;

        fullscreenButton.textContent =
            document.fullscreenElement
                ? "Exit Fullscreen"
                : "Enter Fullscreen";
    }
);


/* ---------------- INITIAL STATE ---------------- */

setFace("center");
updateDebug();
</script>
    
</body>
</html>
