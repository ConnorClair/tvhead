<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}

#screen {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}

#start {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {
    padding: 20px 40px;

    font-size: 24px;

    border: none;

    border-radius: 10px;
}

#debug {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 20;

    padding: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;
}

</style>

</head>

<body>

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
>
```

</div>

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the phone in the costume position.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<div id="debug">

```
Sensor: WAITING
```

</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    /*
     * How much movement is required before
     * a directional face is activated.
     */

    movementThreshold: 25,


    /*
     * How quickly the reference position
     * follows normal movement.
     *
     * Higher = follows faster.
     */

    trackingSpeed: 0.08,


    /*
     * How often the sensor is evaluated.
     */

    updateRate: 50

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById("face");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const debug =
    document.getElementById("debug");


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "";


// ============================================================
// SENSOR VALUES
// ============================================================

let gamma = 0;

let beta = 0;


// ============================================================
// MOVING REFERENCE
// ============================================================

let referenceGamma = 0;

let referenceBeta = 0;


// ============================================================
// STATE
// ============================================================

let started = false;

let lastUpdate = 0;


// ============================================================
// FACE CHANGER
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;

    face.src = faces[name];

}


// ============================================================
// SENSOR EVENT
// ============================================================

function orientationChanged(event) {

    if (!started) {
        return;
    }


    if (
        typeof event.gamma === "number"
    ) {

        gamma = event.gamma;

    }


    if (
        typeof event.beta === "number"
    ) {

        beta = event.beta;

    }

}


// ============================================================
// MAIN MOTION CHECK
// ============================================================

function checkMovement() {

    if (!started) {
        return;
    }


    const now =
        Date.now();


    /*
     * Limit how often the position is checked.
     */

    if (
        now - lastUpdate <
        SETTINGS.updateRate
    ) {

        requestAnimationFrame(
            checkMovement
        );

        return;

    }


    lastUpdate = now;


    // ========================================================
    // DIFFERENCE FROM CURRENT REFERENCE
    // ========================================================

    const gammaDifference =
        gamma - referenceGamma;

    const betaDifference =
        beta - referenceBeta;


    // ========================================================
    // DETERMINE WHETHER MOVEMENT IS LARGE
    // ========================================================

    const horizontalMovement =
        gammaDifference;

    const verticalMovement =
        betaDifference;


    const threshold =
        SETTINGS.movementThreshold;


    let movementDetected = false;


    // ========================================================
    // LANDSCAPE AXIS MAPPING
    // ========================================================

    /*
     *
     * The axes are intentionally swapped for
     * landscape-mounted phones.
     *
     * gamma → physical forward/back
     * beta  → physical left/right
     *
     */


    // --------------------------------------------------------
    // LEFT / RIGHT
    // --------------------------------------------------------

    if (
        verticalMovement <
        -threshold
    ) {

        setFace("left");

        movementDetected = true;

    }


    else if (
        verticalMovement >
        threshold
    ) {

        setFace("right");

        movementDetected = true;

    }


    // --------------------------------------------------------
    // UP / DOWN
    // --------------------------------------------------------

    else if (
        horizontalMovement <
        -threshold
    ) {

        setFace("up");

        movementDetected = true;

    }


    else if (
        horizontalMovement >
        threshold
    ) {

        setFace("down");

        movementDetected = true;

    }


    // ========================================================
    // NO LARGE MOVEMENT
    // ========================================================

    else {

        /*
         * Return to the default face.
         */

        setFace("center");


        /*
         * Slowly move the reference position
         * toward the phone's current position.
         *
         * This means the wearer can turn their
         * entire head/body and the new position
         * becomes the new center.
         */

        referenceGamma +=
            (gamma - referenceGamma) *
            SETTINGS.trackingSpeed;


        referenceBeta +=
            (beta - referenceBeta) *
            SETTINGS.trackingSpeed;

    }


    updateDebug();


    requestAnimationFrame(
        checkMovement
    );

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    const gammaDifference =
        gamma - referenceGamma;

    const betaDifference =
        beta - referenceBeta;


    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        "<br>" +

        "Beta: " +
        beta.toFixed(1) +
        "<br><br>" +

        "Gamma Δ: " +
        gammaDifference.toFixed(1) +
        "<br>" +

        "Beta Δ: " +
        betaDifference.toFixed(1) +
        "<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// START
// ============================================================

async function start() {


    // --------------------------------------------------------
    // REQUEST IOS SENSOR PERMISSION
    // --------------------------------------------------------

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                alert(
                    "Motion sensor permission was denied."
                );

                return;

            }

        } catch (error) {

            console.error(error);

            alert(
                "Could not access motion sensors."
            );

            return;

        }

    }


    // --------------------------------------------------------
    // LISTEN FOR ORIENTATION
    // --------------------------------------------------------

    window.addEventListener(
        "deviceorientation",
        orientationChanged,
        true
    );


    // --------------------------------------------------------
    // WAIT FOR INITIAL SENSOR DATA
    // --------------------------------------------------------

    setTimeout(() => {


        /*
         * Initial position becomes the
         * starting reference.
         */

        referenceGamma =
            gamma;

        referenceBeta =
            beta;


        started = true;


        setFace("center");


        startScreen.style.display =
            "none";


        requestAnimationFrame(
            checkMovement
        );


    }, 500);

}


// ============================================================
// START BUTTON
// ============================================================

startButton.addEventListener(
    "click",
    start
);


// ============================================================
// DEBUG TOGGLE
// ============================================================

let tapCount = 0;

let tapTimer;


document.body.addEventListener(
    "click",
    () => {

        tapCount++;


        clearTimeout(tapTimer);


        tapTimer = setTimeout(
            () => {

                tapCount = 0;

            },
            500
        );


        if (tapCount >= 3) {

            debug.style.display =
                debug.style.display === "none"
                    ? "block"
                    : "none";

            tapCount = 0;

        }

    }
);


</script>

</body>
</html>
