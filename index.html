<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}

#screen {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}

#start {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {
    padding: 20px 40px;

    font-size: 24px;

    border: none;

    border-radius: 10px;
}

#debug {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 20;

    padding: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;
}

</style>

</head>

<body>

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
>
```

</div>

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the phone in its normal
    costume position.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<div id="debug">
    Sensor: WAITING
</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    /*
     * Degrees of movement required before
     * changing to a directional face.
     */

    horizontalThreshold: 15,

    verticalThreshold: 15

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById("face");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const debug =
    document.getElementById("debug");


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "";


// ============================================================
// SENSOR VALUES
// ============================================================

let gamma = 0;

let beta = 0;


// Center position

let centerGamma = 0;

let centerBeta = 0;


// ============================================================
// STATE
// ============================================================

let started = false;


// ============================================================
// FACE
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;

    face.src = faces[name];

}


// ============================================================
// SENSOR EVENT
// ============================================================

function orientationChanged(event) {

    if (!started) {
        return;
    }


    if (
        typeof event.gamma === "number"
    ) {

        gamma = event.gamma;

    }


    if (
        typeof event.beta === "number"
    ) {

        beta = event.beta;

    }


    updateFace();

    updateDebug();

}


// ============================================================
// DETERMINE FACE
// ============================================================

function updateFace() {

    /*
     * Calculate movement away from the
     * calibrated center position.
     */

    const horizontal =
        gamma - centerGamma;

    const vertical =
        beta - centerBeta;


    const horizontalLimit =
        SETTINGS.horizontalThreshold;

    const verticalLimit =
        SETTINGS.verticalThreshold;


    /*
     * LEFT
     */

    if (
        horizontal <
        -horizontalLimit
    ) {

        setFace("left");

        return;

    }


    /*
     * RIGHT
     */

    if (
        horizontal >
        horizontalLimit
    ) {

        setFace("right");

        return;

    }


    /*
     * UP
     */

    if (
        vertical <
        -verticalLimit
    ) {

        setFace("up");

        return;

    }


    /*
     * DOWN
     */

    if (
        vertical >
        verticalLimit
    ) {

        setFace("down");

        return;

    }


    /*
     * No major movement.
     *
     * Return to CENTER.
     */

    setFace("center");

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    const horizontal =
        gamma - centerGamma;

    const vertical =
        beta - centerBeta;


    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        "<br>" +

        "Beta: " +
        beta.toFixed(1) +
        "<br><br>" +

        "Horizontal: " +
        horizontal.toFixed(1) +
        "<br>" +

        "Vertical: " +
        vertical.toFixed(1) +
        "<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// START
// ============================================================

async function start() {


    /*
     * iOS permission.
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                alert(
                    "Motion sensor permission was denied."
                );

                return;

            }

        } catch (error) {

            console.error(error);

            alert(
                "Could not access motion sensors."
            );

            return;

        }

    }


    /*
     * Listen for orientation.
     */

    window.addEventListener(
        "deviceorientation",
        orientationChanged,
        true
    );


    /*
     * Wait for the sensor to provide
     * its initial values.
     */

    setTimeout(() => {


        /*
         * The phone's current physical
         * position becomes CENTER.
         */

        centerGamma = gamma;

        centerBeta = beta;


        started = true;


        setFace("center");


        startScreen.style.display =
            "none";


        updateDebug();


    }, 500);

}


// ============================================================
// START BUTTON
// ============================================================

startButton.addEventListener(
    "click",
    start
);


// ============================================================
// DEBUG
// ============================================================

let tapCount = 0;

let tapTimer;


document.body.addEventListener(
    "click",
    () => {

        tapCount++;


        clearTimeout(tapTimer);


        tapTimer = setTimeout(
            () => {

                tapCount = 0;

            },
            500
        );


        if (tapCount >= 3) {

            debug.style.display =
                debug.style.display === "none"
                    ? "block"
                    : "none";

            tapCount = 0;

        }

    }
);


</script>

</body>
</html>
