<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}


/* ============================================================
   FACE
============================================================ */

#screen {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: black;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}


/* ============================================================
   STATIC OVERLAY
============================================================ */

#staticOverlay {

    position: fixed;

    inset: 0;

    z-index: 30;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;

    opacity: 0.25;

    display: block;

}


/* ============================================================
   START SCREEN
============================================================ */

#start {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {

    padding: 16px 30px;

    font-size: 20px;

    border: none;

    border-radius: 10px;

}


/* ============================================================
   CONTROLS
============================================================ */

#controls {

    position: fixed;

    bottom: 30px;
    right: 30px;

    z-index: 50;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.4s ease;

}

#controls.visible {

    opacity: 1;

    pointer-events: auto;

}

#settingsButton {

    width: 60px;
    height: 60px;

    padding: 0;

    border-radius: 50%;

    background:
        rgba(0, 0, 0, 0.7);

    color: white;

    font-size: 28px;

}


/* ============================================================
   SETTINGS
============================================================ */

#settingsPanel {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 90;

    width: min(90vw, 450px);

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    background:
        rgba(20, 20, 20, 0.97);

    color: white;

    border-radius: 15px;

    display: none;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.7);

}

#settingsPanel.open {

    display: block;

}

#settingsPanel h2 {

    margin-top: 0;

}

.setting {

    margin: 25px 0;

}

.setting label {

    display: block;

    margin-bottom: 10px;

    font-size: 18px;

}

.setting input[type="range"] {

    width: 100%;

}

.settingValue {

    margin-top: 5px;

    font-family: monospace;

}

#closeSettings {

    width: 100%;

    margin-top: 10px;

}


/* ============================================================
   DEBUG
============================================================ */

#debug {

    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 200;

    padding: 12px;

    background:
        rgba(0, 0, 0, 0.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;

}

#debug.hidden {

    display: none;

}


/* ============================================================
   FULLSCREEN
============================================================ */

:fullscreen {

    background: black;

}

</style>

</head>

<body>

<!-- ============================================================
     FACE
============================================================ -->

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
    alt=""
>
```

</div>

<!-- ============================================================
     STATIC
============================================================ -->

<img
id="staticOverlay"
src="faces/static.gif"
alt=""

>

<!-- ============================================================
     START
============================================================ -->

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the phone in the position
    it will be worn.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<!-- ============================================================
     CONTROLS
============================================================ -->

<div id="controls">

```
<button id="settingsButton">
    ⚙
</button>
```

</div>

<!-- ============================================================
     SETTINGS
============================================================ -->

<div id="settingsPanel">

```
<h2>Settings</h2>


<!-- FULLSCREEN -->

<div class="setting">

    <label>
        Fullscreen
    </label>

    <button id="fullscreenButton">
        Enter Fullscreen
    </button>

</div>


<!-- DEBUG -->

<div class="setting">

    <label>
        Debug Display
    </label>

    <button id="debugToggle">
        Hide Debug
    </button>

</div>


<!-- SENSITIVITY -->

<div class="setting">

    <label>
        Movement Sensitivity
    </label>

    <input
        id="sensitivity"
        type="range"
        min="20"
        max="200"
        step="5"
        value="80"
    >

    <div
        id="sensitivityValue"
        class="settingValue"
    >
        80 °/s
    </div>

</div>


<!-- FACE TIME -->

<div class="setting">

    <label>
        Face Display Time
    </label>

    <input
        id="faceTime"
        type="range"
        min="0.25"
        max="10"
        step="0.25"
        value="2"
    >

    <div
        id="faceTimeValue"
        class="settingValue"
    >
        2.00 seconds
    </div>

</div>


<!-- STATIC -->

<div class="setting">

    <label>
        TV Static
    </label>

    <button id="staticToggle">
        Hide Static
    </button>

</div>


<!-- STATIC OPACITY -->

<div class="setting">

    <label>
        Static Opacity
    </label>

    <input
        id="staticOpacity"
        type="range"
        min="0"
        max="100"
        step="1"
        value="25"
    >

    <div
        id="staticOpacityValue"
        class="settingValue"
    >
        25%
    </div>

</div>


<button id="closeSettings">
    CLOSE
</button>
```

</div>

<!-- ============================================================
     DEBUG
============================================================ -->

<div id="debug">

```
Sensor: WAITING
```

</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    rotationThreshold: 80,

    minimumFaceTime: 2000,

    controlsFadeTime: 2500,

    staticOpacity: 0.25

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById("face");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const controls =
    document.getElementById("controls");

const settingsButton =
    document.getElementById("settingsButton");

const settingsPanel =
    document.getElementById("settingsPanel");

const closeSettings =
    document.getElementById("closeSettings");

const debug =
    document.getElementById("debug");

const debugToggle =
    document.getElementById("debugToggle");

const sensitivity =
    document.getElementById("sensitivity");

const sensitivityValue =
    document.getElementById("sensitivityValue");

const faceTime =
    document.getElementById("faceTime");

const faceTimeValue =
    document.getElementById("faceTimeValue");

const staticOverlay =
    document.getElementById("staticOverlay");

const staticToggle =
    document.getElementById("staticToggle");

const staticOpacity =
    document.getElementById("staticOpacity");

const staticOpacityValue =
    document.getElementById(
        "staticOpacityValue"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "";


// ============================================================
// MOTION
// ============================================================

let alpha = 0;

let beta = 0;

let gamma = 0;


// ============================================================
// STATE
// ============================================================

let sensorReady = false;

let faceStartedAt = 0;

let faceTimer = null;

let controlsTimer = null;

let debugVisible = true;

let staticVisible = true;


// ============================================================
// FACE
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;

    face.src =
        faces[name];

}


// ============================================================
// TRIGGER FACE
// ============================================================

function triggerFace(name) {

    /*
     * Same direction does not restart timer.
     */

    if (currentFace === name) {
        return;
    }


    /*
     * A new direction immediately
     * replaces the old direction.
     */

    clearTimeout(faceTimer);


    setFace(name);


    faceStartedAt =
        Date.now();


    faceTimer =
        setTimeout(
            () => {

                setFace("center");

            },
            SETTINGS.minimumFaceTime
        );

}


// ============================================================
// MOTION
// ============================================================

function motionChanged(event) {

    if (!sensorReady) {
        return;
    }


    if (!event.rotationRate) {
        return;
    }


    alpha =
        event.rotationRate.alpha || 0;

    beta =
        event.rotationRate.beta || 0;

    gamma =
        event.rotationRate.gamma || 0;


    detectRotation();

    updateDebug();

}


// ============================================================
// ROTATION
// ============================================================

function detectRotation() {

    const threshold =
        SETTINGS.rotationThreshold;


    // LEFT / RIGHT

    if (
        Math.abs(alpha) >= threshold
    ) {

        if (alpha > 0) {

            triggerFace("right");

        } else {

            triggerFace("left");

        }

        return;

    }


    // UP / DOWN

    if (
        Math.abs(beta) >= threshold
    ) {

        if (beta > 0) {

            triggerFace("down");

        } else {

            triggerFace("up");

        }

        return;

    }

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    if (!debugVisible) {
        return;
    }


    const remaining =
        currentFace === "center"
            ? 0
            : Math.max(
                0,
                SETTINGS.minimumFaceTime -
                (
                    Date.now() -
                    faceStartedAt
                )
            );


    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Alpha: " +
        alpha.toFixed(1) +
        " °/s<br>" +

        "Beta: " +
        beta.toFixed(1) +
        " °/s<br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        " °/s<br><br>" +

        "Threshold: " +
        SETTINGS.rotationThreshold +
        " °/s<br>" +

        "Face time: " +
        (remaining / 1000).toFixed(2) +
        " s<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// CONTROLS FADE
// ============================================================

function showControls() {

    controls.classList.add(
        "visible"
    );


    clearTimeout(
        controlsTimer
    );


    controlsTimer =
        setTimeout(
            () => {

                if (
                    !settingsPanel.classList
                        .contains("open")
                ) {

                    controls.classList.remove(
                        "visible"
                    );

                }

            },
            SETTINGS.controlsFadeTime
        );

}


// ============================================================
// SCREEN TAP
// ============================================================

document.body.addEventListener(
    "click",
    (event) => {

        if (
            settingsPanel.contains(
                event.target
            )
        ) {

            return;

        }


        if (
            event.target ===
            settingsButton
        ) {

            return;

        }


        showControls();

    }
);


// ============================================================
// SETTINGS BUTTON
// ============================================================

settingsButton.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();


        settingsPanel.classList.add(
            "open"
        );


        clearTimeout(
            controlsTimer
        );


        controls.classList.add(
            "visible"
        );

    }
);


// ============================================================
// CLOSE SETTINGS
// ============================================================

closeSettings.addEventListener(
    "click",
    () => {

        settingsPanel.classList.remove(
            "open"
        );

        showControls();

    }
);


// ============================================================
// DEBUG TOGGLE
// ============================================================

debugToggle.addEventListener(
    "click",
    () => {

        debugVisible =
            !debugVisible;


        if (debugVisible) {

            debug.classList.remove(
                "hidden"
            );

            debugToggle.textContent =
                "Hide Debug";

            updateDebug();

        } else {

            debug.classList.add(
                "hidden"
            );

            debugToggle.textContent =
                "Show Debug";

        }

    }
);


// ============================================================
// SENSITIVITY
// ============================================================

sensitivity.addEventListener(
    "input",
    () => {

        SETTINGS.rotationThreshold =
            Number(
                sensitivity.value
            );


        sensitivityValue.textContent =
            SETTINGS.rotationThreshold +
            " °/s";


        updateDebug();

    }
);


// ============================================================
// FACE TIME
// ============================================================

faceTime.addEventListener(
    "input",
    () => {

        const seconds =
            Number(
                faceTime.value
            );


        SETTINGS.minimumFaceTime =
            seconds * 1000;


        faceTimeValue.textContent =
            seconds.toFixed(2) +
            " seconds";


        /*
         * If a directional face is currently
         * active, restart its timer.
         */

        if (
            currentFace !== "center"
        ) {

            clearTimeout(
                faceTimer
            );


            faceStartedAt =
                Date.now();


            faceTimer =
                setTimeout(
                    () => {

                        setFace("center");

                    },
                    SETTINGS.minimumFaceTime
                );

        }


        updateDebug();

    }
);


// ============================================================
// STATIC TOGGLE
// ============================================================

staticToggle.addEventListener(
    "click",
    () => {

        staticVisible =
            !staticVisible;


        if (staticVisible) {

            staticOverlay.style.display =
                "block";

            staticToggle.textContent =
                "Hide Static";

        } else {

            staticOverlay.style.display =
                "none";

            staticToggle.textContent =
                "Show Static";

        }

    }
);


// ============================================================
// STATIC OPACITY
// ============================================================

staticOpacity.addEventListener(
    "input",
    () => {

        const value =
            Number(
                staticOpacity.value
            );


        SETTINGS.staticOpacity =
            value / 100;


        staticOverlay.style.opacity =
            SETTINGS.staticOpacity;


        staticOpacityValue.textContent =
            value + "%";

    }
);


// ============================================================
// FULLSCREEN
// ============================================================

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

                fullscreenButton.textContent =
                    "Exit Fullscreen";

            } else {

                await document.exitFullscreen();

                fullscreenButton.textContent =
                    "Enter Fullscreen";

            }

        } catch (error) {

            console.error(error);

            alert(
                "Fullscreen is not available."
            );

        }

    }
);


// ============================================================
// UPDATE FULLSCREEN BUTTON
// ============================================================

document.addEventListener(
    "fullscreenchange",
    () => {

        if (
            document.fullscreenElement
        ) {

            fullscreenButton.textContent =
                "Exit Fullscreen";

        } else {

            fullscreenButton.textContent =
                "Enter Fullscreen";

        }

    }
);


// ============================================================
// START
// ============================================================

async function start() {

    if (
        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                alert(
                    "Motion sensor permission was denied."
                );

                return;

            }

        } catch (error) {

            console.error(error);

            alert(
                "Could not access motion sensors."
            );

            return;

        }

    }


    window.addEventListener(
        "devicemotion",
        motionChanged,
        true
    );


    sensorReady = true;


    setFace("center");


    startScreen.style.display =
        "none";


    debugVisible = true;

    debug.classList.remove(
        "hidden"
    );


    updateDebug();

}


// ============================================================
// START BUTTON
// ============================================================

startButton.addEventListener(
    "click",
    start
);


// ============================================================
// INITIAL STATE
// ============================================================

staticOverlay.style.opacity =
    SETTINGS.staticOpacity;

debug.classList.remove(
    "hidden"
);

</script>

</body>
</html>
