<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}

#screen {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}

#start {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {
    padding: 20px 40px;

    font-size: 24px;

    border: none;

    border-radius: 10px;
}

#debug {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 20;

    padding: 12px;

    background: rgba(0, 0, 0, 0.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;
}

</style>

</head>

<body>

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
>
```

</div>

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the phone in the position
    it will be worn.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<div id="debug">
    Sensor: WAITING
</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    /*
     * Rotational velocity required to trigger
     * a directional face.
     *
     * Degrees per second.
     */

    rotationThreshold: 80,


    /*
     * Minimum amount of time a directional
     * face stays visible.
     *
     * 2000 = 2 seconds.
     */

    minimumFaceTime: 2000

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById("face");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const debug =
    document.getElementById("debug");


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "";


// ============================================================
// ROTATION VELOCITY
// ============================================================

let alpha = 0;

let beta = 0;

let gamma = 0;


// ============================================================
// FACE STATE
// ============================================================

let faceStartedAt = 0;

let faceTimer = null;

let sensorReady = false;


// ============================================================
// CHANGE FACE
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;

    face.src = faces[name];

}


// ============================================================
// SHOW DIRECTIONAL FACE
// ============================================================

function triggerFace(name) {

    /*
     * Don't restart the timer if the same
     * directional face is already active.
     */

    if (currentFace === name) {
        return;
    }


    clearTimeout(faceTimer);


    setFace(name);


    faceStartedAt =
        Date.now();


    /*
     * The face cannot return to center
     * until at least 2 seconds have passed.
     */

    faceTimer = setTimeout(
        () => {

            setFace("center");

        },
        SETTINGS.minimumFaceTime
    );

}


// ============================================================
// MOTION SENSOR
// ============================================================

function motionChanged(event) {

    if (!sensorReady) {
        return;
    }


    if (!event.rotationRate) {
        return;
    }


    alpha =
        event.rotationRate.alpha || 0;

    beta =
        event.rotationRate.beta || 0;

    gamma =
        event.rotationRate.gamma || 0;


    detectRotation();

}


// ============================================================
// ROTATION DETECTION
// ============================================================

function detectRotation() {

    const threshold =
        SETTINGS.rotationThreshold;


    /*
     * Don't allow a new face to interrupt
     * the current 2-second display period.
     */

    if (
        currentFace !== "center"
    ) {

        updateDebug();

        return;

    }


    // ========================================================
    // LEFT / RIGHT
    // ========================================================

    /*
     * Alpha is used for horizontal rotation.
     */

    if (
        Math.abs(alpha) >= threshold
    ) {

        if (alpha > 0) {

            triggerFace("right");

        } else {

            triggerFace("left");

        }

        updateDebug();

        return;

    }


    // ========================================================
    // UP / DOWN
    // ========================================================

    /*
     * Beta is used for vertical rotation.
     */

    if (
        Math.abs(beta) >= threshold
    ) {

        if (beta > 0) {

            triggerFace("down");

        } else {

            triggerFace("up");

        }

        updateDebug();

        return;

    }


    updateDebug();

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    const remaining =
        currentFace === "center"
            ? 0
            : Math.max(
                0,
                SETTINGS.minimumFaceTime -
                (Date.now() - faceStartedAt)
            );


    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Alpha: " +
        alpha.toFixed(1) +
        " °/s<br>" +

        "Beta: " +
        beta.toFixed(1) +
        " °/s<br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        " °/s<br><br>" +

        "Threshold: " +
        SETTINGS.rotationThreshold +
        " °/s<br>" +

        "Face time remaining: " +
        (remaining / 1000).toFixed(1) +
        " s<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// START
// ============================================================

async function start() {


    /*
     * iOS motion permission.
     */

    if (
        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                alert(
                    "Motion sensor permission was denied."
                );

                return;

            }

        } catch (error) {

            console.error(error);

            alert(
                "Could not access motion sensors."
            );

            return;

        }

    }


    /*
     * Start receiving motion data.
     */

    window.addEventListener(
        "devicemotion",
        motionChanged,
        true
    );


    sensorReady = true;


    setFace("center");


    startScreen.style.display =
        "none";


    updateDebug();

}


// ============================================================
// START BUTTON
// ============================================================

startButton.addEventListener(
    "click",
    start
);


// ============================================================
// DEBUG TOGGLE
// ============================================================

let tapCount = 0;

let tapTimer;


document.body.addEventListener(
    "click",
    () => {

        tapCount++;


        clearTimeout(tapTimer);


        tapTimer = setTimeout(
            () => {

                tapCount = 0;

            },
            500
        );


        if (tapCount >= 3) {

            debug.style.display =
                debug.style.display === "none"
                    ? "block"
                    : "none";

            tapCount = 0;

        }

    }
);


</script>

</body>
</html>
