<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
   initial-scale=1.0,
   maximum-scale=1.0,
   user-scalable=no">

<title>TV Head</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    font-family: Arial, sans-serif;
}

#screen {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;
}

#face {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    pointer-events: none;
}

#start {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    background: black;

    color: white;

    text-align: center;
}

button {
    padding: 20px 40px;

    font-size: 24px;

    border: none;

    border-radius: 10px;
}

#debug {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 20;

    padding: 12px;

    background: rgba(0, 0, 0, 0.75);

    color: white;

    font-family: monospace;

    font-size: 16px;

    line-height: 1.5;
}

</style>

</head>

<body>

<div id="screen">

```
<img
    id="face"
    src="faces/center.png"
>
```

</div>

<div id="start">

```
<h1>TV HEAD</h1>

<p>
    Hold the phone in the costume position.
</p>

<p>
    Landscape orientation.<br>
    Screen facing forward.
</p>

<button id="startButton">
    START
</button>
```

</div>

<div id="debug">
    Sensor: WAITING
</div>

<script>


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    /*
     * Rotational velocity required to trigger
     * a directional face.
     *
     * Units: degrees per second.
     *
     * Try 60-120 for normal head movement.
     */

    rotationThreshold: 80,


    /*
     * How long the directional face remains
     * after rotational movement stops.
     */

    resetDelay: 200

};


// ============================================================
// ELEMENTS
// ============================================================

const face =
    document.getElementById("face");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const debug =
    document.getElementById("debug");


// ============================================================
// FACES
// ============================================================

const faces = {

    center: "faces/center.png",

    left: "faces/left.png",

    right: "faces/right.png",

    up: "faces/up.png",

    down: "faces/down.png"

};


let currentFace = "";


// ============================================================
// ROTATIONAL VELOCITY
// ============================================================

let rotationAlpha = 0;

let rotationBeta = 0;

let rotationGamma = 0;


// ============================================================
// STATE
// ============================================================

let sensorReady = false;

let resetTimer = null;


// ============================================================
// FACE CHANGER
// ============================================================

function setFace(name) {

    if (!faces[name]) {
        return;
    }

    if (currentFace === name) {
        return;
    }

    currentFace = name;

    face.src = faces[name];

}


// ============================================================
// MOTION SENSOR
// ============================================================

function motionChanged(event) {

    if (!sensorReady) {
        return;
    }


    const rate =
        event.rotationRate;


    if (!rate) {
        return;
    }


    /*
     * Rotation rate is measured in
     * degrees per second.
     */

    rotationAlpha =
        rate.alpha || 0;

    rotationBeta =
        rate.beta || 0;

    rotationGamma =
        rate.gamma || 0;


    detectRotation();

}


// ============================================================
// ROTATION DETECTION
// ============================================================

function detectRotation() {

    const threshold =
        SETTINGS.rotationThreshold;


    /*
     * Clear the previous reset timer.
     */

    clearTimeout(resetTimer);


    // ========================================================
    // LANDSCAPE AXIS MAPPING
    // ========================================================

    /*
     *
     * alpha = rotation around the phone's Z axis
     * beta  = rotation around the X axis
     * gamma = rotation around the Y axis
     *
     * For the phone mounted landscape and facing
     * forward, beta/gamma are used for the
     * directional reactions.
     */


    // --------------------------------------------------------
    // LEFT / RIGHT
    // --------------------------------------------------------

    if (
        Math.abs(rotationBeta) >= threshold
    ) {

        if (rotationBeta > 0) {

            setFace("right");

        } else {

            setFace("left");

        }


        startResetTimer();

        updateDebug();

        return;

    }


    // --------------------------------------------------------
    // UP / DOWN
    // --------------------------------------------------------

    if (
        Math.abs(rotationGamma) >= threshold
    ) {

        if (rotationGamma > 0) {

            setFace("down");

        } else {

            setFace("up");

        }


        startResetTimer();

        updateDebug();

        return;

    }


    /*
     * No significant rotational velocity.
     */

    setFace("center");

    updateDebug();

}


// ============================================================
// RESET TIMER
// ============================================================

function startResetTimer() {

    resetTimer =
        setTimeout(
            () => {

                setFace("center");

            },
            SETTINGS.resetDelay
        );

}


// ============================================================
// DEBUG
// ============================================================

function updateDebug() {

    debug.innerHTML =

        "Sensor: ACTIVE<br><br>" +

        "Alpha: " +
        rotationAlpha.toFixed(1) +
        " °/s<br>" +

        "Beta: " +
        rotationBeta.toFixed(1) +
        " °/s<br>" +

        "Gamma: " +
        rotationGamma.toFixed(1) +
        " °/s<br><br>" +

        "Threshold: " +
        SETTINGS.rotationThreshold +
        " °/s<br><br>" +

        "Face: " +
        currentFace;

}


// ============================================================
// START
// ============================================================

async function start() {


    // --------------------------------------------------------
    // IOS PERMISSION
    // --------------------------------------------------------

    if (
        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof DeviceMotionEvent
            .requestPermission ===
            "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                alert(
                    "Motion sensor permission was denied."
                );

                return;

            }

        } catch (error) {

            console.error(error);

            alert(
                "Could not access motion sensors."
            );

            return;

        }

    }


    // --------------------------------------------------------
    // LISTEN FOR MOTION
    // --------------------------------------------------------

    window.addEventListener(
        "devicemotion",
        motionChanged,
        true
    );


    sensorReady = true;


    setFace("center");


    startScreen.style.display =
        "none";


    updateDebug();

}


// ============================================================
// START BUTTON
// ============================================================

startButton.addEventListener(
    "click",
    start
);


// ============================================================
// DEBUG TOGGLE
// ============================================================

let tapCount = 0;

let tapTimer;


document.body.addEventListener(
    "click",
    () => {

        tapCount++;


        clearTimeout(tapTimer);


        tapTimer = setTimeout(
            () => {

                tapCount = 0;

            },
            500
        );


        if (tapCount >= 3) {

            debug.style.display =
                debug.style.display === "none"
                    ? "block"
                    : "none";

            tapCount = 0;

        }

    }
);


</script>

</body>
</html>
